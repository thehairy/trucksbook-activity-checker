<!DOCTYPE html>
<html>
<head>
  <title>TB Activity Manager</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #f4f4f4; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #2b5797; }
    textarea { width: 100%; height: 200px; box-sizing: border-box; margin-bottom: 15px; font-family: monospace; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 12px 25px; background-color: #2b5797; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 4px; }
    button:hover { background-color: #1e3f70; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    
    .status-box { margin-top: 20px; padding: 15px; background: #eef; border-radius: 4px; border: 1px solid #ccd; }
    .progress-bar { height: 8px; background: #eee; margin-top: 15px; width: 100%; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #2b5797; width: 0%; transition: width 0.3s; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    th { background-color: #f9f9f9; }
  </style>
</head>
<body>
  <div class="container">
    <h2>TrucksBook Activity Checker</h2>
    <p>Paste User IDs below (one per line):</p>
    <textarea id="idInput" placeholder="568087&#10;123456"></textarea>
    
    <button id="startBtn">Start Check</button>
    
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status-box" id="status">Ready to check.</div>

    <table id="previewTable">
      <thead><tr><th>ID</th><th>Status</th><th>Last Date</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="tool.js"></script>
</body>
</html>
