<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TB Activity Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 30px;
      background: #f0f2f5;
      margin: 0;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #2b5797;
      font-size: 22px;
      letter-spacing: 0.3px;
    }

    /* ── Phase transitions ── */
    .phase {
      animation: fadeIn 0.4s ease forwards;
    }
    .phase.hidden {
      display: none !important;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── INPUT PHASE ── */
    #phase-input p { margin: 0 0 10px; color: #555; }

    textarea {
      width: 100%;
      height: 180px;
      margin-bottom: 16px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: #2b5797; }

    .btn-primary {
      padding: 12px 28px;
      background: #2b5797;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover  { background: #1e3f70; }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      padding: 11px 24px;
      background: #fff;
      color: #2b5797;
      border: 2px solid #2b5797;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    .btn-secondary:hover  { background: #2b5797; color: #fff; }
    .btn-secondary:active { transform: scale(0.97); }

    /* ── LOADING PHASE ── */
    #phase-loading {
      text-align: center;
      padding: 20px 0 10px;
    }

    .spinner-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid #e0e7f0;
      border-top-color: #2b5797;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #step-label {
      font-size: 14px;
      color: #555;
      min-height: 22px;
      animation: fadeIn 0.2s ease forwards;
    }

    /* progress bar inside loading */
    .progress-bar {
      height: 6px;
      background: #e0e7f0;
      border-radius: 3px;
      overflow: hidden;
      margin: 18px 0 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2b5797, #4a82cc);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* ── RESULTS PHASE ── */
    #phase-results .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      animation: fadeIn 0.4s ease forwards;
    }
    th {
      background: #f1f4fb;
      color: #2b5797;
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 2px solid #dce3f0;
      text-align: left;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #eef0f6;
      color: #333;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9fc; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-active   { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <h2>TrucksBook Activity Checker</h2>

    <!-- ── PHASE 1: INPUT ── -->
    <div id="phase-input" class="phase">
      <p>Paste User IDs below (one per line):</p>
      <textarea id="idInput" placeholder="568087&#10;123456"></textarea>
      <button id="startBtn" class="btn-primary">Start Check</button>
    </div>

    <!-- ── PHASE 2: LOADING ── -->
    <div id="phase-loading" class="phase hidden">
      <div class="spinner-wrap">
        <div class="spinner"></div>
      </div>
      <p id="step-label"></p>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- ── PHASE 3: RESULTS ── -->
    <div id="phase-results" class="phase hidden">
      <div class="actions">
        <button id="downloadBtn" class="btn-primary">⬇ Download CSV</button>
        <button id="refreshBtn" class="btn-secondary">↺ Start Over</button>
      </div>
      <table id="previewTable">
        <thead><tr><th>ID</th><th>Status</th><th>Last Date</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="tool.js"></script>
</body>
</html>
